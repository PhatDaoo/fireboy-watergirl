<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fireboy & Watergirl 1: Forest Temple</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <!-- NATIVE HTML5 CANVAS (Authentic 640x480 SWF Stage scaled cleanly) -->
    <div id="stage-wrapper">
        <canvas id="game-canvas" width="640" height="480"></canvas>
    </div>

    <!-- WEBRTC PHONE CONTROLLER LOBBY (Floating corner widget, collapsible) -->
    <div id="lobby" class="minimized">
        <div id="lobby-header">
            <span id="lobby-title">🎮 Tay cầm Điện thoại (WebRTC)</span>
            <button id="toggle-btn" onclick="toggleLobby()">➕ Hiện mã QR</button>
        </div>
        <div id="minimized-view">
            <span id="mini-status">📱 Quét QR để kết nối tay cầm</span>
        </div>
        <div id="expanded-view">
            <div id="lobby-left">
                <div id="slot-1" class="slot"><div class="dot"></div> P1 (🔥 Fireboy - Phím Mũi tên)</div>
                <div id="slot-2" class="slot"><div class="dot"></div> P2 (💧 Watergirl - Phím W/A/D)</div>
                <div id="connect-info">Đang khởi tạo máy chủ WebRTC...</div>
            </div>
            <div id="qr-container" style="display: none;">
                <div id="qr-text">Quét mã bằng ĐT</div>
                <div id="qrcode"></div>
            </div>
        </div>
    </div>

    <script>
        let isLobbyMinimized = true;
        function toggleLobby() {
            isLobbyMinimized = !isLobbyMinimized;
            const lobby = document.getElementById('lobby');
            const btn = document.getElementById('toggle-btn');
            if (isLobbyMinimized) {
                lobby.classList.add('minimized');
                btn.innerText = '➕ Hiện mã QR';
            } else {
                lobby.classList.remove('minimized');
                btn.innerText = '➖ Thu nhỏ';
            }
        }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
