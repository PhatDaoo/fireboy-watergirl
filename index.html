<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fireboy &amp; Watergirl — 4 Temples (Ruffle Flash)</title>
    <link rel="stylesheet" href="css/style.css" />
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            publicPath: 'vendor/ruffle/',
            autoplay: 'on',
            unmuteOverlay: 'hidden',
            backgroundColor: '#000000',
            letterbox: 'on',
            quality: 'high',
            splashScreen: false,
            warnOnUnsupportedContent: false,
            contextMenu: 'rightClickOnly',
            allowScriptAccess: false
        };
    </script>
    <script src="vendor/ruffle/ruffle.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
    <main id="app-shell">
        <!-- TOP TEMPLE SWITCHER BAR (Outside 4:3 stage so it never overlaps in-game UI) -->
        <header id="temple-bar" role="navigation" aria-label="Chọn phần chơi">
            <div class="temple-tabs">
                <button class="temple-btn" data-temple="forest">1. Forest</button>
                <button class="temple-btn" data-temple="light">2. Light</button>
                <button class="temple-btn" data-temple="ice">3. Ice</button>
                <button class="temple-btn" data-temple="crystal">4. Crystal</button>
            </div>
            <div class="temple-actions">
                <button id="toggle-btn" class="action-btn" type="button" title="Kết nối tay cầm điện thoại qua QR">📱 Tay cầm</button>
                <button id="btn-reload" class="action-btn" title="Tải lại đền hiện tại">↻ Tải lại</button>
                <button id="btn-fullscreen" class="action-btn" title="Toàn màn hình">⛶ Full</button>
            </div>
        </header>

        <!-- RUFFLE FLASH STAGE (Authentic 4:3 aspect ratio) -->
        <div id="stage-wrapper">
            <div id="ruffle-container"></div>
        </div>

        <footer id="controls-hint">
            <span>🔥 <b>Fireboy</b>: Phím Mũi tên (← ↑ →)</span>
            <span class="sep">•</span>
            <span>💧 <b>Watergirl</b>: W / A / D</span>
            <span class="sep">•</span>
            <span id="mini-status">📱 Quét QR để kết nối tay cầm</span>
        </footer>
    </main>

    <!-- WEBRTC PHONE CONTROLLER LOBBY (Collapsible popup, never overlaps top bar) -->
    <div id="lobby" class="minimized">
        <div id="lobby-header">
            <span id="lobby-title">🎮 Tay cầm Điện thoại (WebRTC)</span>
            <button id="close-lobby-btn" type="button">✕</button>
        </div>
        <div id="expanded-view">
            <div id="lobby-left">
                <div id="slot-1" class="slot"><div class="dot"></div> P1 (🔥 Fireboy - Phím Mũi tên)</div>
                <div id="slot-2" class="slot"><div class="dot"></div> P2 (💧 Watergirl - Phím W/A/D)</div>
                <div id="connect-info">Đang khởi tạo máy chủ WebRTC...</div>
            </div>
            <div id="qr-container" style="display: none;">
                <div id="qr-text">Quét mã bằng ĐT</div>
                <div id="qrcode"></div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
